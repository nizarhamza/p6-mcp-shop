name: Check the catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # MCP for Primavera P6 release whose rules, tools and demo fixture (tests/fixtures/make_demo.py) check the
  # catalog. The core skills need 1.9.0 or later (publish.yml is pinned to the same release).
  P6MCP_REF: v2.0.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: MCP for Primavera P6 (package, tests/fixtures)
        uses: actions/checkout@v7
        with:
          repository: nizarhamza/p6-mcp
          ref: ${{ env.P6MCP_REF }}
          path: p6mcp-src

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MCP for Primavera P6 and pytest
        run: python -m pip install ./p6mcp-src pytest

      - name: Build leaves skills/ and index.json unchanged
        env:
          PYTHONPATH: p6mcp-src
          P6MCP_SRC: p6mcp-src
        run: |
          python tools/catalog.py build
          changed="$(git status --porcelain --untracked-files=all -- skills index.json)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "skills/ or index.json is not the build of src/: run python tools/catalog.py build and commit"
            exit 1
          fi

      - name: Every skill valid, index.json up to date
        env:
          PYTHONPATH: p6mcp-src
        run: python tools/catalog.py check

      - name: Golden harness, oracles and catalog tool tests
        env:
          PYTHONPATH: p6mcp-src
          P6MCP_SRC: p6mcp-src
        run: python -m pytest -v
